<html lang="uz">
<head>
<meta charset="utf-8">

<style>

:root{--blue:#2f6fd6;--bg:#f4f6fa;--card:#fff;--line:#e3e6ee;--ink:#1f2430;--mute:#6b7280;--ok:#16a34a;--okbg:#e8f7ee;--bad:#dc2626;--badbg:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.ko{font-family:"Noto Sans KR",sans-serif}
header{background:var(--blue);color:#fff;padding:22px 16px 24px}
.wrap{max-width:730px;margin:0 auto}
header h1{margin:6px 0 4px;font-size:clamp(22px,5vw,30px);font-weight:800}
header h1 small{font-weight:500;font-size:.68em;opacity:.95}
header p{margin:4px 0;opacity:.95;font-size:15px}
header a{color:#fff;font-weight:700}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.3)}
main{padding:18px 16px 30px}
.box{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.box h3{margin:0 0 4px;font-size:18px}
.hint{color:var(--mute);font-style:italic;font-size:14px;margin-bottom:12px}
label.lbl{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--blue)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.small{font-size:13px;color:var(--mute)}
.lesson{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;border-left:7px solid var(--c);box-shadow:0 1px 3px rgba(20,30,60,.06);transition:transform .12s}
.lesson:hover{transform:translateY(-2px)}
.lesson .tag{color:var(--c);font-weight:800;font-size:13px}
.lesson h2{margin:6px 0 4px;font-size:19px}
.lesson h2 span{font-weight:400;color:var(--mute);font-size:.85em;font-family:Nunito,sans-serif}
.lesson .topic{color:var(--mute);font-size:14px}
.lesson.done .tag::after{content:" ✓ bajarildi";color:var(--ok)}
.btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.btn.blue{color:var(--blue)}
.btn.solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.word{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;cursor:pointer;font:inherit;text-align:center;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.word b{font-family:"Noto Sans KR";font-size:17px;font-weight:700}
.word span{font-size:13px;color:var(--mute);visibility:hidden}
.word.show span,.showall .word span{visibility:visible}
.word.speak{border-color:var(--blue)}
.stage{font-weight:800;font-size:13px;color:var(--blue);margin:14px 0 6px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mbtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px;font:inherit;cursor:pointer;min-height:46px}
.mbtn.k{font-family:"Noto Sans KR";font-weight:700;font-size:16px}
.mbtn.sel{border-color:var(--blue);background:#eaf1fd}
.mbtn.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}
.mbtn.bad{border-color:var(--bad);background:var(--badbg);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qt{font-weight:700;margin-bottom:8px}
.qt em{display:inline-block;min-width:24px;color:var(--blue);font-style:normal}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts .mbtn{flex:1;min-width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:150px}
.fb{font-size:14px;margin-top:6px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
input.ok{border-color:var(--ok)!important;background:var(--okbg)}
input.bad{border-color:var(--bad)!important}
.score{margin-top:12px;font-weight:800}
.next{display:block;width:100%;padding:14px;font-size:16px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 16px 30px}
footer a{color:var(--blue)}
.reset{margin-top:10px;font-size:13px;padding:6px 10px}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 4px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.done::after{content:"✓";margin-left:3px}
@media(max-width:480px){.tab{font-size:12.5px;padding:10px 2px;white-space:nowrap}}
.tip{background:#eaf1fd;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:8px}
.text p{font-family:"Noto Sans KR";font-size:16.5px;line-height:1.9;margin:0 0 12px}
.gl{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--blue);cursor:pointer}
.gl i{font-style:normal;font-family:Nunito;font-size:13px;background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
details summary{cursor:pointer;color:var(--blue);font-weight:700;margin-top:10px}
details p{font-size:15px;line-height:1.6;color:#374151}
.opts.col{flex-direction:column}
.opts.col .mbtn{text-align:left;font-weight:500}
.mbtn.k.s{font-weight:500;font-size:15px}
.tok{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:6px;border:2px dashed var(--line);border-radius:10px;margin-bottom:8px}
.tok .mbtn{min-height:40px;padding:6px 12px;font-family:"Noto Sans KR"}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pool .mbtn{min-height:40px;padding:6px 12px;font-family:"Noto Sans KR"}
.errs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.errs .mbtn{min-height:38px;padding:5px 9px;font-family:"Noto Sans KR";border-color:transparent;background:#f7f8fb}
.errs .mbtn.sel{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.errs .mbtn.ok{border-color:var(--ok)}
.errs .fix{display:block;font-size:12px;color:var(--ok);font-weight:700}
.model{background:#f8f7f2;border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;font-family:"Noto Sans KR";font-size:15px;line-height:1.8}
.model b{color:var(--blue);display:block;margin-bottom:4px}
textarea{width:100%;min-height:200px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:16px/1.7 "Noto Sans KR",sans-serif;outline:none;resize:vertical}
textarea:focus{border-color:var(--blue)}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:3px 0;color:var(--mute)}
.checks li.on{color:var(--ok);font-weight:700}
h2.sec{font-size:22px;margin:4px 0 14px}
.row .btn{min-height:44px}

  const inp=$("input",q),fb=$(".fb",q),[ck,hp]=q.querySelectorAll("button");let h=0,done=false;

}
function mcItem(i,prompt,opts,ans,onDone,col=false,ko=true){
  const q=el("div","q");
  q.innerHTML=`<div class="qt"><em>${i}</em>${esc(prompt)}</div><div class="opts${col?" col":""}">${opts.map((o,j)=>`<button class="mbtn${ko?" k s":""}" data-j="${j}">${esc(o)}</button>`).join("")}</div>`;
  let done=false;
  q.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.j===ans;
    b.classList.add(ok?"ok":"bad");q.querySelectorAll(".mbtn")[ans].classList.add("ok");if(ko)speak(opts[ans]);onDone(ok)});
  return q;
}
function box(title,hint){const b=el("div","box",`<h3>${title}</h3>${hint?`<div class="hint">${hint}</div>`:""}`);return b}
function counter(totalN,onAll,scoreEl){let n=0,ok=0;return good=>{n++;if(good!==false)ok++;if(scoreEl)scoreEl.textContent=n===totalN?`Natija: ${ok} / ${totalN}`:"";if(n===totalN)onAll(ok)}}
function nextBtn(label,fn){const b=el("button","btn solid next");b.textContent=label;b.onclick=fn;return b}

/* ---------- home ---------- */
function home(){
  cur=null;
  $("#head").innerHTML=`<h1>Koreys tili · Uy vazifasi <span class="ko">숙제</span></h1>
  <p class="ko">한국어 첫걸음 2A · 9 dars (1–9) · Lug‘at, o‘qish, grammatika va yozuv</p>
  <p><b>Tuzuvchi: Iroda Normatova · <a href="https://t.me/with_IrodaKorean" target="_blank" rel="noopener">@with_IrodaKorean</a></b></p>`;
  const d=total();
  $("#app").innerHTML=`<div class="box"><label class="lbl" for="nm">Ismingiz / <span class="ko">이름</span></label>
  <input type="text" id="nm" placeholder="Ismingizni yozing" value="${esc(S.name)}">
  <div class="bar"><i style="width:${d/117*100}%"></i></div>
  <div class="small">Umumiy natija: ${d} / 117 topshiriq</div>
  ${d?'<button class="btn reset" id="rs">Natijalarni tozalash</button>':''}</div>`+
  LESSONS.map((l,i)=>{const c=cnt(l.n);return `<button class="lesson ${c==13?'done':''}" style="--c:${COLORS[i]}" data-n="${l.n}">
   <div class="tag">${l.n}-DARS · <span class="ko">제${l.n}과</span></div>
   <h2 class="ko">${l.ko} <span>${l.uz}</span></h2>
   <div class="topic ko">${l.t} · ${esc(D[l.n].gr)}</div>
   <div class="bar"><i style="width:${c/13*100}%"></i></div>
   <div class="small">${c} / 13 topshiriq bajarildi</div></button>`}).join("");
  $("#nm").oninput=e=>{S.name=e.target.value;save()};
  const rs=$("#rs");
  if(rs)rs.onclick=()=>{if(rs.dataset.c){S.done={};S.text={};save();home()}else{rs.dataset.c=1;rs.textContent="Rostdan o‘chirilsinmi? Yana bir marta bosing"}};
  document.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>location.hash="u"+b.dataset.n+"-vocab");
}

/* ---------- lesson ---------- */
function lessonHead(l){
  $("#head").innerHTML=`<div class="nav"><button class="pill" id="bk">← Barcha darslar</button>${l.n<9?`<button class="pill" id="nx">${l.n+1}-dars ›</button>`:""}</div>
  <h1>${l.n}-dars · <span class="ko">${l.ko}</span> <small>${l.uz}</small></h1>
  <p>${cnt(l.n)} / 13 topshiriq bajarildi</p>`;
  $("#bk").onclick=()=>location.hash="";
  const nx=$("#nx");if(nx)nx.onclick=()=>location.hash="u"+(l.n+1)+"-vocab";
}
function paintTabs(){if(!cur)return;document.querySelectorAll(".tab").forEach((b,i)=>{b.classList.toggle("on",TABS[i][0]===curTab);b.classList.toggle("done",TABS[i][2].every(k=>S.done[cur.n+"-"+k]))})}
function lesson(n,tab){
  const l=LESSONS.find(x=>x.n==n);if(!l)return home();
  cur=l;curTab=tab;lessonHead(l);
  const app=$("#app");app.innerHTML="";
  const tabs=el("div","tabs",TABS.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}</button>`).join(""));
  app.appendChild(tabs);tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>location.hash=`u${n}-${b.dataset.t}`);
  paintTabs();
  const body=el("div");app.appendChild(body);
  ({vocab,reading,grammar,writing})[tab](l,body);
}

/* Lug'at */
function vocab(l,body){
  const n=l.n,ws=W[n];
  const bank=box("So‘zlar banki","So‘zni bosing — tarjimasi chiqadi va o‘qib beriladi 🔊");
  bank.insertAdjacentHTML("beforeend",`<div class="grid">${ws.map((w,i)=>`<button class="word" data-i="${i}"><b>${esc(w[0])}</b><span>${esc(w[1])}</span></button>`).join("")}</div>`);
  bank.querySelectorAll(".word").forEach(b=>b.onclick=()=>{b.classList.add("show");speak(ws[b.dataset.i][0])});
  body.appendChild(bank);
  // matching
  const m=box("So‘z va ma’nosini juftlang","Chapdan koreyscha so‘zni, o‘ngdan uning ma’nosini bosing. 2 bosqich.");
  const mw=shuf(ws).slice(0,12),st=[mw.slice(0,6),mw.slice(6,12)];
  m.insertAdjacentHTML("beforeend",st.map((s,si)=>`<div class="stage">${si+1}-bosqich / 2</div><div class="match"><div class="col">${shuf(s).map(w=>`<button class="mbtn k" data-id="${esc(w[0])}">${esc(w[0])}</button>`).join("")}</div><div class="col">${shuf(s).map(w=>`<button class="mbtn" data-id="${esc(w[0])}">${esc(w[1])}</button>`).join("")}</div></div>`).join("")+`<div class="score"></div>`);
  let matched=0;
  m.querySelectorAll(".match").forEach(g=>{let sel={};g.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("ok"))return;const side=b.classList.contains("k")?"k":"u";
    if(sel[side])sel[side].classList.remove("sel");sel[side]=b;b.classList.add("sel");if(side=="k")speak(b.dataset.id);
    if(sel.k&&sel.u){const a=sel.k,c=sel.u;
      if(a.dataset.id===c.dataset.id){[a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("ok")});matched++}
      else{[a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),400)})}
      sel={};if(matched===12){$(".score",m).textContent="🎉 Barakalla! Hammasi juftlandi.";mark(n,"v0")}}})});
  body.appendChild(m);
  // MC
  const t=box("O‘zbekchaga mos so‘z","To‘g‘ri koreyscha so‘zni tanlang.");
  const sc=el("div","score"),tq=shuf(ws).slice(0,6);
  const c1=counter(6,()=>mark(n,"v1"),sc);
  tq.forEach((w,i)=>{const opts=shuf([w,...shuf(ws.filter(x=>x!==w&&x[1]!==w[1])).slice(0,2)]);t.appendChild(mcItem(i+1,w[1],opts.map(o=>o[0]),opts.indexOf(w),c1))});
  t.appendChild(sc);body.appendChild(t);
  // write
  const wr=box("So‘zni yozing","O‘zbekcha ma’nosiga qarab koreyscha yozing. Qiynalsangiz «Yordam»ni bosing.");
  const pool=ws.filter(w=>!/[\/↔]/.test(w[0])),wq=shuf(pool).slice(0,5);let wok=0;
  wq.forEach((w,i)=>wr.appendChild(inputItem(i+1,w[1],[w[0],...ws.filter(x=>x[1]===w[1]&&x!==w).map(x=>x[0])],()=>{if(++wok===5)mark(n,"v2")})));
  body.appendChild(wr);
  body.appendChild(nextBtn("Keyingisi: O‘qish →",()=>location.hash=`u${n}-reading`));
}

/* O'qish */
function glossify(p,gl){
  let h=esc(p);const keys=Object.keys(gl).sort((a,b)=>b.length-a.length);const slots=[];
  keys.forEach(k=>{const ek=esc(k);const i=h.indexOf(ek);if(i<0)return;slots.push(k);h=h.slice(0,i)+"\u0001"+(slots.length-1)+"\u0002"+h.slice(i+ek.length);delete gl[k]});
  return h.replace(/\u0001(\d+)\u0002/g,(_,i)=>`<button class="gl" data-k="${esc(slots[i])}">${esc(slots[i])}</button>`);
}
function reading(l,body){
  const n=l.n,R=D[n].read,gl=Object.assign({},R.gloss);
  const b=box(glossify(R.title,gl),"Matnni o‘qing. Tagiga chizilgan so‘zlarni bosing — tarjimasi chiqadi.");
  b.insertAdjacentHTML("beforeend",`<div class="text">${R.paras.map(p=>`<p>${glossify(p,gl)}</p>`).join("")}</div>
   <button class="btn blue" id="ls">🔊 Matnni tinglash</button>
   <details><summary>O‘zbekcha tarjima</summary><p>${esc(R.tr)}</p></details>`);
  b.querySelectorAll(".gl").forEach(g=>g.onclick=()=>{const k=g.dataset.k;const ex=$("i",g);if(ex){ex.remove();return}g.insertAdjacentHTML("beforeend",`<i>${esc(R.gloss[k])}</i>`);speak(k)});
  $("#ls",b).onclick=()=>speak(R.paras.join(" ").replace(/[☎✉•※↳]/g,""));
  body.appendChild(b);
  const tf=box("To‘g‘ri yoki noto‘g‘ri?","Matn bo‘yicha belgilang.");const s1=el("div","score");
  const c1=counter(R.tf.length,()=>mark(n,"r0"),s1);
  R.tf.forEach((x,i)=>{const q=mcItem(i+1,x[0],["To‘g‘ri ✓","Noto‘g‘ri ✗"],x[1]?0:1,c1,false,false);q.querySelector(".qt").classList.add("ko");tf.appendChild(q)});
  tf.appendChild(s1);body.appendChild(tf);
  const mc=box("Savollarga javob bering","Matn bo‘yicha javobni tanlang.");const s2=el("div","score");
  const c2=counter(R.mc.length,()=>mark(n,"r1"),s2);
  R.mc.forEach((x,i)=>{const q=mcItem(i+1,x[0],x[1],x[2],c2,true);q.querySelector(".qt").classList.add("ko");mc.appendChild(q)});
  mc.appendChild(s2);body.appendChild(mc);
  const fd=box("Matndan so‘zni toping","Matndagi mos so‘zni koreyscha yozing.");let fok=0;
  R.find.forEach((x,i)=>fd.appendChild(inputItem(i+1,x[0],[x[1]],()=>{if(++fok===R.find.length)mark(n,"r2")})));
  body.appendChild(fd);
  body.appendChild(nextBtn("Keyingisi: Grammatika →",()=>location.hash=`u${n}-grammar`));
}

/* Grammatika */
function grammar(l,body){
  const n=l.n;
  D[n].gram.forEach((G,gi)=>{
    const b=box(esc(G.name),"Shaklga keltiring, keyin to‘g‘ri gapni tanlang.");
    b.insertAdjacentHTML("beforeend",`<div class="tip ko">${esc(G.tip)}</div>`);
    const need=G.forms.length+G.mc.length;let k=0;const sc=el("div","score");let good=0;
    const step=ok=>{k++;if(ok!==false)good++;if(k===need){sc.textContent=`✓ Bajarildi (${good} / ${need})`;mark(n,"g"+gi)}};
    G.forms.forEach((f,i)=>b.appendChild(inputItem(i+1,f[0],f[1],()=>step(true))));
    G.mc.forEach((m,i)=>b.appendChild(mcItem(G.forms.length+i+1,m[0],m[1],m[2],step,true)));
    b.appendChild(sc);body.appendChild(b);
  });
  const o=box("Gap tuzing","So‘zlarni bosib, to‘g‘ri tartibda gap tuzing.");let od=0;
  D[n].order.forEach((sent,i)=>{
    const toks=sent.split(" ");let sh=shuf(toks);let tries=0;while(sh.join(" ")===sent&&tries++<10)sh=shuf(toks);
    const q=el("div","q",`<div class="qt"><em>${i+1}</em>Darslikdagi misol gap</div><div class="tok"></div><div class="pool"></div><div class="row"><button class="btn solid">Tekshirish</button><button class="btn">Tozalash</button></div><div class="fb"></div>`);
    const line=$(".tok",q),pool=$(".pool",q),fb=$(".fb",q),[ck,cl]=q.querySelectorAll(".row button");let done=false;
    sh.forEach(w=>{const bt=el("button","mbtn");bt.textContent=w;bt.onclick=()=>{if(done)return;(bt.parentNode===pool?line:pool).appendChild(bt)};pool.appendChild(bt)});
    ck.onclick=()=>{if(done)return;const got=[...line.children].map(x=>x.textContent).join(" ");
      if(got===sent){done=true;fb.className="fb ok";fb.textContent="✓ To‘g‘ri!";line.querySelectorAll(".mbtn").forEach(x=>x.classList.add("ok"));speak(sent);if(++od===D[n].order.length)mark(n,"g4")}
      else{fb.className="fb bad";fb.textContent=pool.children.length?"Hamma so‘zlarni ishlating.":"✗ Tartib noto‘g‘ri, yana urinib ko‘ring."}};
    cl.onclick=()=>{if(done)return;[...line.children].forEach(x=>pool.appendChild(x));fb.textContent=""};
    o.appendChild(q);
  });
  body.appendChild(o);
  body.appendChild(nextBtn("Keyingisi: Yozuv →",()=>location.hash=`u${n}-writing`));
}

/* Yozuv */
function writing(l,body){
  const n=l.n,Wr=D[n].write,R=D[n].read;
  body.appendChild(el("h2","sec",esc(Wr.title)));
  const e=box("1-qadam · Xatolarni toping","Xato yozilgan so‘zlarni bosing (2 ta), keyin «Tekshirish»ni bosing.");
  e.insertAdjacentHTML("beforeend",`<div class="errs">${Wr.errs.map((t,i)=>`<button class="mbtn" data-i="${i}">${esc(t[0])}</button>`).join("")}</div><button class="btn solid">Tekshirish</button><div class="fb"></div>`);
  let eDone=false;const ebs=e.querySelectorAll(".errs .mbtn"),efb=$(".fb",e);
  ebs.forEach(b=>b.onclick=()=>{if(!eDone)b.classList.toggle("sel")});
  $(".btn.solid",e).onclick=()=>{if(eDone)return;let right=0,wrong=0;const need=Wr.errs.filter(x=>x[1]).length;
    ebs.forEach((b,i)=>{const isErr=!!Wr.errs[i][1],s=b.classList.contains("sel");if(s&&isErr)right++;if(s&&!isErr)wrong++});
    if(right===need&&!wrong){eDone=true;efb.className="fb ok";efb.textContent="✓ Barakalla! Hammasi topildi.";
      ebs.forEach((b,i)=>{if(Wr.errs[i][1]){b.classList.remove("sel");b.classList.add("ok");b.innerHTML=`<s>${esc(Wr.errs[i][0])}</s><span class="fix">${esc(Wr.errs[i][1])}</span>`}});mark(n,"w0")}
    else{efb.className="fb bad";efb.textContent=`Topildi: ${right} / ${need}`+(wrong?` · ${wrong} ta to‘g‘ri so‘z belgilangan`:"")+". Yana urinib ko‘ring."}};
  body.appendChild(e);
  const m=box("2-qadam · Namunani o‘qing","Darslikdagi matnni diqqat bilan o‘qing.");
  m.insertAdjacentHTML("beforeend",`<div class="model"><b>${esc(R.title)}</b>${R.paras.map(esc).join(" ")}</div>`);
  body.appendChild(m);
  const w=box("3-qadam · Navbat sizda ✍️",esc(Wr.prompt));
  const checks=[["Kamida 5 ta gap",null],...Wr.checks];
  w.insertAdjacentHTML("beforeend",`<textarea lang="ko" placeholder="Shu yerga koreys tilida yozing…">${esc(S.text[n]||"")}</textarea><div class="small" id="sc"></div><ul class="checks">${checks.map(c=>`<li>○ ${esc(c[0])}</li>`).join("")}</ul><button class="btn solid" id="cp">📋 Nusxa olib, o‘qituvchiga yuborish</button><div class="small" style="margin-top:8px">Matningiz shu qurilmada saqlanadi. Tugma matningiz va ballaringizni nusxalaydi — keyin uni o‘qituvchingizga xabar qilib yuboring.</div><div class="fb" id="cpf"></div>`);
  const ta=$("textarea",w),lis=w.querySelectorAll(".checks li");
  const upd=()=>{const v=ta.value;const sn=v.split(/[.!?。]+/).filter(s=>/[가-힣]/.test(s)).length;
    $("#sc",w).textContent=`${sn} ta gap (maqsad: 5–8)`;let all=true;
    checks.forEach((c,i)=>{const ok=c[1]?new RegExp(c[1]).test(v):sn>=5;if(!ok)all=false;lis[i].classList.toggle("on",ok);lis[i].textContent=(ok?"✓ ":"○ ")+c[0]});
    if(all)mark(n,"w1")};
  ta.oninput=()=>{S.text[n]=ta.value;save();upd()};upd();
  $("#cp",w).onclick=async()=>{const txt=`${S.name||"(ism yozilmagan)"} · Koreys tili 2A · ${n}-dars\nBajarildi: ${cnt(n)} / 13 topshiriq\n\n${ta.value}`;const f=$("#cpf",w);
    try{await navigator.clipboard.writeText(txt);f.className="fb ok";f.textContent="✓ Nusxalandi! Endi o‘qituvchingizga yuboring."}
    catch(err){ta.focus();ta.select();try{document.execCommand("copy");f.className="fb ok";f.textContent="✓ Nusxalandi!"}catch(e2){f.className="fb bad";f.textContent="Nusxalab bo‘lmadi — matnni qo‘lda belgilab nusxalang."}}};
  body.appendChild(w);
  body.appendChild(nextBtn(n<9?`Keyingi dars: ${n+1}-dars →`:"← Barcha darslarga qaytish",()=>location.hash=n<9?`u${n+1}-vocab`:""));
}

function route(){const m=location.hash.match(/^#u(\d)(?:-(vocab|reading|grammar|writing))?/);window.scrollTo(0,0);m?lesson(+m[1],m[2]||"vocab"):home()}
window.addEventListener("hashchange",route);route();
}
</script>
